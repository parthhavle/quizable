<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Unavailable</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #F4F2EC;
      --surface: #FFFFFF;
      --border: #111111;
      --accent: #FF4500; 
      --text: #111111;
      --text-muted: #555555;
    }
    
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(#d5d3ce 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .error-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 3.5rem 2.5rem;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 8px 8px 0 var(--border);
      position: relative;
    }

    .error-card::before {
      content: 'STATUS: 410';
      position: absolute;
      top: -12px;
      left: 24px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border: 2px solid var(--border);
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 1rem;
      color: var(--text);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .btn-home {
      display: inline-block;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 1rem;
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.15s;
      box-shadow: 4px 4px 0 var(--border);
    }

    .btn-home:hover {
      background: var(--accent);
      color: #fff;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--border);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <h1>Unavailable</h1>
    <p>The service you are looking for is no longer available.</p>
    <a href="/" class="btn-home">← Back to Home</a>
  </div>

</body>
</html>
